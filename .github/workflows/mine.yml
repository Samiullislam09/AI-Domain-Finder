name: Mine domains

on:
  schedule:
    - cron: "*/30 * * * *"   # har 30 minute (24/7)
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:     # har job = kitne words + kitne letter (alag mining, parallel)
          - { words: 1, range: "3-5" }
          - { words: 1, range: "6-8" }
          - { words: 2, range: "5-7" }
          - { words: 2, range: "8-10" }
          - { words: 2, range: "11-14" }
          - { words: 3, range: "8-11" }
          - { words: 3, range: "12-14" }
          - { words: 3, range: "15-18" }
    concurrency:
      group: mine-${{ matrix.words }}-${{ matrix.range }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mine ${{ matrix.words }}-word ${{ matrix.range }} letter
        timeout-minutes: 25
        continue-on-error: true
        run: node miner.mjs
        env:
          WORDS: ${{ matrix.words }}
          RANGE: ${{ matrix.range }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          MINE_MINUTES: "20"
      - name: Save results
        if: ${{ !cancelled() }}
        run: |
          git config user.name "domain-miner"
          git config user.email "domain-miner@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Mine ${{ matrix.words }}-word ${{ matrix.range }} letter: new free domains"
          for i in 1 2 3 4 5 6; do
            git pull --rebase && git push && exit 0
            sleep $((RANDOM % 10 + 3))
          done
          exit 1

  # Cron GitHub par bharosemand nahi hota, isliye har run khatam hone par agli run khud shuru karta hai (24/7 chain).
  # Roakne ke liye: Actions mein run ko Cancel karo ya workflow ko Disable karo.
  rerun:
    needs: mine
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Wait first if the run failed (taaki tez loop na bane)
        if: ${{ needs.mine.result != 'success' }}
        run: sleep 600
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mine.yml --repo ${{ github.repository }} --ref main
