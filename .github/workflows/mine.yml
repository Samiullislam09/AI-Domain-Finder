name: Mine domains

on:
  schedule:
    - cron: "*/30 * * * *"   # har 30 minute (24/7)
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        len: [4, 5, 6, 7, 8, 9, 10]   # har length ki alag mining (parallel)
    concurrency:
      group: mine-${{ matrix.len }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mine ${{ matrix.len }} letter
        run: node miner.mjs
        env:
          LEN: ${{ matrix.len }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          MINE_MINUTES: "20"
      - name: Save results
        run: |
          git config user.name "domain-miner"
          git config user.email "domain-miner@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Mine ${{ matrix.len }} letter: new free domains"
          for i in 1 2 3 4 5 6; do
            git pull --rebase && git push && exit 0
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
