name: Mine domains

on:
  schedule:
    - cron: "*/30 * * * *"   # har 30 minute (24/7)
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:     # focus: chhote naam. coined = 3/4/5 letter bolne layak invented naam; curated = 6-9 letter asli words ke jod
          - { label: "coined 5-letter", coined: "5", range: "5-5" }
          - { label: "coined 4-letter", coined: "4", range: "4-4" }
          - { label: "coined 3-letter", coined: "3", range: "3-3" }
          - { label: "curated 2-word 6-7", words: "2", vocab: "1", range: "6-7" }
          - { label: "curated 2-word 8", words: "2", vocab: "1", range: "8-8" }
          - { label: "curated 2-word 9", words: "2", vocab: "1", range: "9-9" }
    concurrency:
      group: mine-${{ matrix.label }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Load the saved data (index branch)
        run: |
          if git fetch --depth=1 origin index; then
            git checkout FETCH_HEAD -- data 2>/dev/null && echo "data restored from the index branch" || echo "no data on the index branch yet"
          fi
          mkdir -p data
          sleep 1
          touch /tmp/marker
      - name: Mine ${{ matrix.label }}
        timeout-minutes: 25
        continue-on-error: true
        run: node miner.mjs
        env:
          WORDS: ${{ matrix.words }}
          VOCAB: ${{ matrix.vocab }}
          COINED: ${{ matrix.coined }}
          RANGE: ${{ matrix.range }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          MINE_MINUTES: "20"
      - name: Collect this job's files
        if: ${{ !cancelled() }}
        run: |
          mkdir -p out
          find data -type f -newer /tmp/marker -exec cp --parents {} out/ \;
          echo "files from this job:"; find out -type f | head -20
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mined-${{ strategy.job-index }}
          path: out/
          if-no-files-found: ignore
          retention-days: 1

  # Pehle se mile hue naamon ko dobara registry se check karta hai (mining ke saath-saath chalta hai).
  # Jo naam ab registered nikle wo state/taken.json mein jate hain; index job unko available list se hata deta hai.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: verify
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Load the last published index and state
        run: |
          mkdir -p state
          if git fetch --depth=1 origin index; then
            git show FETCH_HEAD:all.json > data/all.json 2>/dev/null || rm -f data/all.json
            for f in verified.json taken.json; do git show FETCH_HEAD:$f > state/$f 2>/dev/null || rm -f state/$f; done
          fi
      - name: Re-verify found names
        continue-on-error: true
        run: node verify.mjs
        env:
          VERIFY_MINUTES: "18"
      - uses: actions/upload-artifact@v4
        with:
          name: verify-state
          path: state/
          if-no-files-found: ignore
          retention-days: 1

  # Mining ka saara data ab sirf "index" branch par rehta hai (main par commit nahi hote, isliye Vercel ka deployment limit nahi bharta).
  # Ye job akela likhne wala hai: purana data + is cycle ke mining results + verify state jodta hai, index banata hai,
  # aur sab kuch ek hi commit se index branch par overwrite karta hai (history nahi badhti).
  index:
    needs: [mine, verify]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: index-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore the saved data and state (index branch)
        run: |
          mkdir -p state data
          if git fetch --depth=1 origin index; then
            git checkout FETCH_HEAD -- data 2>/dev/null || echo "no data on the index branch yet"
            for f in verified.json taken.json; do git show FETCH_HEAD:$f > state/$f 2>/dev/null || rm -f state/$f; done
          fi
      - name: Get this cycle's mining results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: mined-*
          merge-multiple: true
          path: mined
      - name: Add the new mining results to the data
        run: |
          if [ -d mined/data ]; then
            cp -r mined/data/. data/
            echo "merged $(find mined/data -type f | wc -l) files"
          else
            echo "no new mining results this cycle"
          fi
      - name: Get the verify state
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: verify-state
          path: state
      - name: Build compact index
        run: node build-index.mjs
      - name: Publish data and index to the index branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/idx/data /tmp/idx/docs
          cp -r data/. /tmp/idx/data/
          mv /tmp/idx/data/all.json /tmp/idx/data/summary.json /tmp/idx/
          cp state/verified.json state/taken.json /tmp/idx/ 2>/dev/null || true
          cd /tmp/idx
          # Vercel is connected to this repo: a tiny docs/ folder + vercel.json keeps it from building this data branch
          printf '{"git":{"deploymentEnabled":false}}' > docs/vercel.json
          printf '<!doctype html><title>data</title>' > docs/index.html
          git init -q -b index
          git config user.name "domain-miner"
          git config user.email "domain-miner@users.noreply.github.com"
          git add -A
          git commit -q -m "Mining data and index"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          git push -f -q origin index

  # Cron GitHub par bharosemand nahi hota, isliye har run khatam hone par agli run khud shuru karta hai (24/7 chain).
  # Roakne ke liye: Actions mein run ko Cancel karo ya workflow ko Disable karo.
  rerun:
    needs: [mine, verify, index]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Wait first if the run failed (taaki tez loop na bane)
        if: ${{ needs.mine.result != 'success' || needs.index.result != 'success' }}
        run: sleep 600
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mine.yml --repo ${{ github.repository }} --ref main
